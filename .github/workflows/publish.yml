name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # The real checkout authenticates with RELEASE_TOKEN, so read the check
      # with the built-in token first: an expired release token should fail
      # here, by name, not at checkout with a git credential prompt error.
      - uses: actions/checkout@v4
        with:
          path: .release-check
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Require a working release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: .release-check/.github/scripts/check-release-token.sh

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm run build

      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
